<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Illustration of an acoustic guitar with sound waves">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3f3fb"/>
      <stop offset="1" stop-color="#edf6e1"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c77a"/>
      <stop offset="1" stop-color="#d9963f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- sound waves -->
  <g fill="none" stroke-linecap="round" stroke-width="5">
    <path d="M60 300c40-50 80 50 120 0s80 50 120 0" stroke="#1f9fd6" opacity=".55"/>
    <path d="M60 340c40-50 80 50 120 0s80 50 120 0" stroke="#8cc63f" opacity=".55"/>
    <path d="M500 110c40-50 80 50 120 0s80 50 120 0" stroke="#8cc63f" opacity=".55"/>
    <path d="M500 150c40-50 80 50 120 0s80 50 120 0" stroke="#1f9fd6" opacity=".55"/>
  </g>

  <!-- guitar, tilted -->
  <g transform="rotate(-35 400 225)">
    <!-- neck and headstock -->
    <rect x="388" y="20" width="24" height="200" rx="4" fill="#7a4a24"/>
    <rect x="378" y="-30" width="44" height="58" rx="10" fill="#5a3418"/>
    <g fill="#f0b400">
      <circle cx="372" cy="-16" r="5"/><circle cx="372" cy="0" r="5"/><circle cx="372" cy="16" r="5"/>
      <circle cx="428" cy="-16" r="5"/><circle cx="428" cy="0" r="5"/><circle cx="428" cy="16" r="5"/>
    </g>
    <g stroke="#c9b48a" stroke-width="2">
      <line x1="388" y1="60" x2="412" y2="60"/><line x1="388" y1="100" x2="412" y2="100"/>
      <line x1="388" y1="136" x2="412" y2="136"/><line x1="388" y1="168" x2="412" y2="168"/>
      <line x1="388" y1="196" x2="412" y2="196"/>
    </g>
    <!-- body -->
    <path d="M400 190c-60 0-92 34-82 78 6 26-34 44-34 96 0 60 52 96 116 96s116-36 116-96c0-52-40-70-34-96 10-44-22-78-82-78z" fill="url(#wood)" stroke="#8a5526" stroke-width="5"/>
    <circle cx="400" cy="300" r="34" fill="#3b220f"/>
    <circle cx="400" cy="300" r="40" fill="none" stroke="#8a5526" stroke-width="4"/>
    <rect x="370" y="390" width="60" height="14" rx="4" fill="#5a3418"/>
    <!-- strings -->
    <g stroke="#f8f6f1" stroke-width="1.6">
      <line x1="391" y1="-10" x2="391" y2="397"/><line x1="394.6" y1="-10" x2="394.6" y2="397"/>
      <line x1="398.2" y1="-10" x2="398.2" y2="397"/><line x1="401.8" y1="-10" x2="401.8" y2="397"/>
      <line x1="405.4" y1="-10" x2="405.4" y2="397"/><line x1="409" y1="-10" x2="409" y2="397"/>
    </g>
  </g>

  <!-- notes -->
  <g fill="#0e2a3b" opacity=".75">
    <circle cx="610" cy="300" r="11"/><rect x="618" y="248" width="4" height="54"/>
    <circle cx="660" cy="285" r="11"/><rect x="668" y="233" width="4" height="54"/>
    <path d="M618 248l54-15v8l-54 15z"/>
    <circle cx="170" cy="130" r="11"/><rect x="178" y="78" width="4" height="54"/>
  </g>
</svg>
